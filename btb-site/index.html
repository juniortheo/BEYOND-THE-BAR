<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Beyond the Bar</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Beyond the Bar (BTB) is a regional legal, business and professional development platform founded by Cavenbridge Advocates (Uganda) and Trust Law Chambers (Rwanda). Re-thinking legal practice." />
    <meta name="theme-color" content="#f4efe6" media="(max-width: 1023.98px)" data-mobile />
    <meta name="theme-color" content="#082640" />
    <meta property="og:title" content="Beyond the Bar | Re-thinking Legal Practice" />
    <meta property="og:description" content="Webinars, executive training, conferences, research and cross-border facilitation for East Africa's legal and business community." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <!--
      Netlify Forms detects forms in the deployed HTML at build time. The real form is
      rendered by React (src/components/SessionRegistrationForm.tsx), so this hidden copy
      registers it. Keep its name and fields in sync with that component.
    -->
    <form name="next-session-registration" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="organisation" />
      <select name="country">
        <option value="Uganda">Uganda</option>
        <option value="Rwanda">Rwanda</option>
        <option value="Other">Other</option>
      </select>
      <input type="text" name="bot-field" />
    </form>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
